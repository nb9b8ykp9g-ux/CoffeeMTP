<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Carnet café — Montpellier</title>

<!-- PWA / écran d'accueil iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet café">
<meta name="theme-color" content="#3C2414">
<link rel="apple-touch-icon" href="icone.png">
<link rel="icon" href="icone.png">
<style>
  :root{
    --espresso:#2B1710;
    --mocha:#A8672E;
    --latte:#DDAD6C;
    --milk:#F4E4C6;
    --cream-bg:#F8F0E1;
    --ink:#2A1B10;
    --ink-soft:#6B4E30;
    --card:#FFFCF6;
    --line:#E9D7B4;
    --danger:#8B3A2B;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  *{
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
  }
  input, textarea{
    -webkit-user-select:text;
    user-select:text;
    -webkit-touch-callout:default;
  }
  body{
    margin:0;
    background:var(--cream-bg);
    color:var(--ink);
    font-family:var(--font-body);
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:460px;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    -ms-overflow-style:none;
    background:
      radial-gradient(ellipse 500px 300px at 10% 0%, rgba(221,173,108,0.20), transparent 60%),
      radial-gradient(ellipse 400px 300px at 95% 20%, rgba(168,103,46,0.12), transparent 55%),
      var(--cream-bg);
    position:relative;
  }
  #app::-webkit-scrollbar{ display:none; }
  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--espresso);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
  svg{ pointer-events:none; }

  /* ---- Hero (Cafés tab) ---- */
  .hero{
    position:relative;
    height:calc(190px + env(safe-area-inset-top));
    margin:0 0 20px;
    border-radius:0 0 26px 26px;
    overflow:hidden;
    background-color:var(--espresso);
    background-image:
      linear-gradient(135deg, rgba(28,15,8,0.62) 0%, rgba(28,15,8,0.22) 45%, rgba(28,15,8,0.05) 70%),
      url('fond-cafe.jpg');
    background-size:cover;
    background-position:center;
    box-shadow:0 8px 20px -10px rgba(43,23,16,0.5);
  }
  .hero-text{ position:relative; z-index:3; padding:calc(24px + env(safe-area-inset-top)) 22px 0; }
  .hero-text h1{
    font-family:var(--font-display);
    font-weight:400;
    font-size:28px;
    margin:0 0 4px;
    color:var(--milk);
    text-shadow:0 1px 4px rgba(0,0,0,0.28);
    letter-spacing:0.2px;
  }
  .hero-text p{
    margin:0;
    font-size:13px;
    color:rgba(255,246,233,0.82);
  }
  .list-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px 10px;
  }
  .list-header span{ font-size:12.5px; color:var(--ink-soft); }
  .link-btn{
    display:flex; align-items:center; gap:5px;
    background:none; border:none;
    color:var(--mocha); font-size:12.5px; font-weight:700;
    padding:4px;
  }
  .link-btn svg{ width:14px; height:14px; }

  /* ---- Cards (used by both tabs) ---- */
  .cafe-list{ padding:2px 20px calc(94px + env(safe-area-inset-bottom)); }
  .ranking-list{ padding:0 20px calc(94px + env(safe-area-inset-bottom)); }
  .cafe-card{
    width:100%;
    display:flex; align-items:center; gap:12px;
    background:var(--card);
    border:none; border-radius:16px;
    padding:11px 14px;
    margin-bottom:9px;
    text-align:left;
    box-shadow:0 2px 8px rgba(60,36,20,0.08), 0 1px 2px rgba(60,36,20,0.05);
    transition:transform 0.1s ease, opacity 0.1s ease;
  }
  .cafe-card:active{ transform:scale(0.98); opacity:0.82; }
  .cafe-info{ flex:1; min-width:0; }
  .cafe-name{
    font-size:15px; font-weight:600; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cafe-addr{
    font-size:12px; color:var(--ink-soft); margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chev{ color:var(--line); flex-shrink:0; display:flex; }
  .chev svg{ width:18px; height:18px; display:block; }

  .ring-badge{ position:relative; width:46px; height:46px; flex-shrink:0; }
  .ring-badge svg{ display:block; }
  .ring-value{
    position:absolute; top:0; right:0; bottom:0; left:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:15px; color:var(--mocha);
  }
  .ring-value.small{ font-size:13px; }
  .avatar-badge{
    width:46px; height:46px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:17px; font-weight:600;
  }
  .avatar-badge.small{ width:40px; height:40px; font-size:14px; }
  .rank-chip{
    width:24px; height:24px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:700; color:var(--ink-soft); background:var(--line);
  }
  .rank-chip.top{ background:var(--mocha); color:#fff; }

  .add-row{
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:none;
    border:2px dashed var(--line); border-radius:16px;
    padding:14px;
    margin-top:2px;
    color:var(--mocha);
    font-size:14px; font-weight:700;
    transition:transform 0.1s ease, opacity 0.1s ease;
  }
  .add-row:active{ transform:scale(0.98); opacity:0.82; }
  .add-row svg{ width:16px; height:16px; }

  .new-form{
    background:var(--card);
    border-radius:16px;
    padding:14px;
    display:flex; flex-direction:column; gap:8px;
    box-shadow:0 2px 8px rgba(60,36,20,0.08);
  }
  .new-form input{
    font-family:inherit; font-size:14.5px;
    padding:10px 12px;
    border:1px solid var(--line); border-radius:8px;
    background:var(--cream-bg); color:var(--ink);
  }
  .new-form-actions{ display:flex; gap:10px; margin-top:2px; }
  .btn{
    padding:9px 16px; border-radius:8px;
    font-size:14px; font-weight:700;
    border:1px solid var(--line);
    background:var(--card); color:var(--ink);
    transition:transform 0.1s ease, opacity 0.1s ease;
  }
  .btn:active{ transform:scale(0.97); opacity:0.85; }
  .btn-primary{ background:var(--mocha); border-color:var(--mocha); color:#fff; box-shadow:0 2px 6px rgba(60,36,20,0.25); }
  .btn-danger{ background:var(--danger); border-color:var(--danger); color:#fff; }

  /* ---- Ranking tab ---- */
  .ranking-header{ padding:calc(26px + env(safe-area-inset-top)) 20px 2px; }
  .ranking-header h1{
    font-family:var(--font-display); font-weight:400; font-size:26px;
    margin:0 0 4px; color:var(--ink);
  }
  .ranking-header p{ margin:0 0 4px; font-size:13px; color:var(--ink-soft); }
  .chips{
    display:flex; gap:8px; overflow-x:auto;
    padding:10px 20px 16px;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    padding:8px 14px; border-radius:16px;
    border:1px solid var(--line); background:var(--card);
    color:var(--ink-soft); font-size:13px; font-weight:700;
    white-space:nowrap;
  }
  .chip.selected{ background:var(--mocha); border-color:var(--mocha); color:#fff; }

  /* ---- Tab bar ---- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0;
    max-width:460px; margin:0 auto;
    display:flex;
    background:var(--card);
    border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    z-index:20;
    box-shadow:0 -2px 10px rgba(60,36,20,0.08);
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; padding:6px 4px;
    color:var(--ink-soft);
    transition:transform 0.1s ease;
  }
  .tab-btn:active{ transform:scale(0.92); }
  .tab-btn svg{ width:22px; height:22px; }
  .tab-btn span{ font-size:10.5px; font-weight:700; }
  .tab-btn.active{ color:var(--mocha); }

  /* ---- Detail (bottom sheet) ---- */
  .sheet{
    position:fixed;
    top:0; right:0; bottom:0; left:0;
    max-width:460px;
    margin:0 auto;
    background:
      radial-gradient(ellipse 500px 300px at 10% 0%, rgba(221,173,108,0.18), transparent 55%),
      var(--cream-bg);
    transform:translateY(100%);
    transition:transform 0.28s ease;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none; -ms-overflow-style:none;
    z-index:30;
  }
  .sheet::-webkit-scrollbar{ display:none; }
  .sheet.open{ transform:translateY(0); }

  .sheet-top{
    display:flex; align-items:center; gap:12px;
    padding:calc(20px + env(safe-area-inset-top)) 18px 6px;
  }
  .back-btn{
    background:none; border:none; padding:6px 6px 6px 0; color:var(--ink);
    transition:transform 0.1s ease, opacity 0.1s ease;
  }
  .back-btn:active{ transform:scale(0.88); opacity:0.7; }
  .back-btn svg{ width:22px; height:22px; display:block; }
  .sheet-title{ min-width:0; }
  .sheet-title h2{
    font-family:var(--font-display); font-weight:400; font-size:19px; margin:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .sheet-title p{
    margin:2px 0 0; font-size:12.5px; color:var(--ink-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .total-block{ text-align:center; padding:16px 20px 6px; }
  .total-number{ font-family:var(--font-display); font-size:50px; color:var(--mocha); line-height:1; }
  .total-number span{ font-size:19px; color:var(--ink-soft); font-family:var(--font-body); }
  .total-bar{ height:5px; background:var(--line); border-radius:3px; margin:14px 20px 0; overflow:hidden; }
  .total-bar-fill{
    height:100%;
    background:linear-gradient(90deg, var(--espresso), var(--mocha) 55%, var(--latte));
    transition:width 0.25s ease;
  }

  .criteria{ padding:8px 18px 4px; }
  .criterion{ padding:15px 0; border-bottom:1px solid var(--line); }
  .criterion-label{ font-size:14.5px; font-weight:700; }
  .criterion-desc{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .pills{ display:flex; gap:7px; margin-top:10px; flex-wrap:wrap; }
  .pill{
    min-width:34px; height:34px; padding:0 10px;
    border-radius:17px; border:1px solid var(--line);
    background:var(--card); color:var(--ink);
    font-size:13.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.1s ease, opacity 0.1s ease;
  }
  .pill:active{ transform:scale(0.9); }
  .pill.selected{ background:var(--mocha); border-color:var(--mocha); color:#fff; box-shadow:0 2px 6px rgba(60,36,20,0.25); }

  .notes-block{ padding:14px 18px 4px; }
  .notes-block label{ font-size:13px; font-weight:700; display:block; margin-bottom:6px; }
  .notes-block textarea{
    width:100%; min-height:60px;
    font-family:inherit; font-size:14px;
    padding:10px 12px;
    border:1px solid var(--line); border-radius:8px;
    background:var(--card); color:var(--ink);
    resize:vertical;
  }

  .sheet-actions{
    padding:8px 16px calc(28px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:2px;
  }
  .text-action{
    display:flex; align-items:center; gap:8px;
    background:none; border:none;
    padding:11px 6px; border-radius:8px;
    font-size:13.5px; font-weight:700; color:var(--ink-soft);
    transition:opacity 0.1s ease;
  }
  .text-action:active{ opacity:0.6; }
  .text-action svg{ width:16px; height:16px; }
  .text-action.danger{ color:var(--danger); }

  /* ---- Confirm modal ---- */
  .modal-overlay{
    position:fixed; top:0; right:0; bottom:0; left:0;
    background:rgba(42,27,16,0.5);
    display:flex; align-items:center; justify-content:center;
    padding:28px; z-index:50;
  }
  .modal-box{
    background:var(--card); border-radius:18px;
    padding:24px 20px 20px; max-width:300px; width:100%;
    box-shadow:0 12px 30px rgba(0,0,0,0.3);
  }
  .modal-box p{ margin:0 0 18px; font-size:14.5px; color:var(--ink); text-align:center; line-height:1.4; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions .btn{ flex:1; }

  .loading{ padding:60px 20px; text-align:center; color:var(--ink-soft); font-size:14px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  var STORAGE_KEY = 'cafes-v2';
  var OLD_STORAGE_KEY = 'cafes-v1';

  /* ---------- Storage backend: Claude artifact storage, with a
     localStorage fallback when opened outside Claude (plain browser) ---------- */
  var storageBackend = (function(){
    if (window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function'){
      return {
        get: function(key){
          return window.storage.get(key, false).then(function(res){
            return (res && typeof res.value !== 'undefined') ? res.value : null;
          });
        },
        set: function(key, value){ return window.storage.set(key, value, false); }
      };
    }
    return {
      get: function(key){
        return new Promise(function(resolve, reject){
          try{
            var v = window.localStorage.getItem(key);
            if (v === null){ reject(new Error('not-found')); return; }
            resolve(v);
          } catch(e){ reject(e); }
        });
      },
      set: function(key, value){
        return new Promise(function(resolve, reject){
          try{ window.localStorage.setItem(key, value); resolve(); }
          catch(e){ reject(e); }
        });
      }
    };
  })();

  var ICONS = {
    cup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13a3 3 0 0 1 0 6h-1"/><path d="M4 8v7a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4v-1"/><path d="M8 2c-.6 1 .6 1.5 0 3M12 2c-.6 1 .6 1.5 0 3"/></svg>',
    trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"/><path d="M8 5H5a3 3 0 0 0 3 4M16 5h3a3 3 0 0 1-3 4"/><path d="M12 12v3M9 19h6M10 19v-2.3a2 2 0 0 1 4 0V19"/></svg>',
    chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 1 0 18 16"/><path d="M20 5v6h-6"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>'
  };

  var AVATAR_COLORS = ['#A8672E','#7A4A20','#C9955A','#8F5A2E','#5C3A1E','#B37D3F'];

  var CRITERIA = [
    { key:'cafe',        label:'Café',            desc:'Qualité, goût, choix de torréfactions', max:5, binary:false },
    { key:'ambiance',    label:'Lieu & Ambiance',  desc:'Déco, calme, luminosité, terrasse, concept', max:5, binary:false },
    { key:'gentillesse', label:'Gentillesse',      desc:'Accueil, service', max:3, binary:false },
    { key:'poussette',   label:'Accès poussette',  desc:'', max:1, binary:true },
    { key:'horaires',    label:'Horaires',         desc:"D'ouverture, pratiques", max:1, binary:true },
    { key:'autres',      label:'Autres',           desc:'Wifi, prises, rapport qualité-prix…', max:5, binary:false }
  ];
  var MAX_TOTAL = CRITERIA.reduce(function(s,c){ return s+c.max; }, 0);
  var RANK_OPTIONS = [{ key:'total', label:'Total', max:MAX_TOTAL }].concat(
    CRITERIA.map(function(c){ return { key:c.key, label:c.label, max:c.max }; })
  );

  var DEFAULT_CAFES = [
    ["Nola Coffee", "22 Rue de l'Université"],
    ["Coffee Club Montpellier", "12 Rue Saint-Guilhem"],
    ["Dyade Coffee", "30 Rue de l'Université"],
    ["Station Café", "2 Rue de l'Ancien Courrier"],
    ["Coldrip food and coffee", "4 Rue Glaize"],
    ["Montpellier Café Solo", "30 Rue Saint-Guilhem"],
    ["POLANKA Coffee Shop", "4 Rue des Teissiers"],
    ["ADN Café", "2 Rue de la Carbonnerie"],
    ["Café Cours", "6 Rue Jacques d'Aragon"],
    ["Botan - Café & Botanique", "42 Rue de l'Aiguillerie"],
    ["Café Joyeux", "9 Pl. Alexandre Laissac"],
    ["French Coffee Shop", "40 Rue Saint-Guilhem"],
    ["Café BUN - Étuves", "5 Rue des Étuves"],
    ["De la Sierra - Comédie", "3 Pass. Bruyas"],
    ["Céleste Coffee Shop", "11 Rue du Palais des Guilhem"],
    ["Brûlerie du Courreau", "9 Rue du Faubourg du Courreau"],
    ["Coffea", "1 Rue des Pertuisanes"]
  ].map(function(pair, i){
    return {
      id: 'c' + i,
      name: pair[0],
      address: pair[1],
      scores: { cafe:null, ambiance:null, gentillesse:null, poussette:null, horaires:null, autres:null },
      comment: '',
      custom: false
    };
  });

  var state = {
    loading: true,
    cafes: [],
    tab: 'cafes',
    rankBy: 'total',
    activeId: null,
    addingNew: false,
    confirm: null
  };

  var saveTimer = null;
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      storageBackend.set(STORAGE_KEY, JSON.stringify(state.cafes)).catch(function(){});
    }, 400);
  }

  function emptyScores(){
    return { cafe:null, ambiance:null, gentillesse:null, poussette:null, horaires:null, autres:null };
  }

  function hasAnyRating(cafe){
    return CRITERIA.some(function(c){ return cafe.scores[c.key] !== null && cafe.scores[c.key] !== undefined; });
  }

  function totalScore(cafe){
    return CRITERIA.reduce(function(s,c){ return s + (cafe.scores[c.key] || 0); }, 0);
  }

  function criterionValue(cafe, key){
    if (key === 'total') return hasAnyRating(cafe) ? totalScore(cafe) : null;
    var v = cafe.scores[key];
    return (v === undefined) ? null : v;
  }

  function getActiveCafe(){
    for (var i=0;i<state.cafes.length;i++){
      if (state.cafes[i].id === state.activeId) return state.cafes[i];
    }
    return null;
  }

  function findCafe(id){
    for (var i=0;i<state.cafes.length;i++){
      if (state.cafes[i].id === id) return state.cafes[i];
    }
    return null;
  }

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, function(ch){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch];
    });
  }

  function avatarColor(name){
    var h = 0;
    for (var i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) % 997; }
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  function initials(name){
    return (name.trim().charAt(0) || '?').toUpperCase();
  }

  function ringSvg(pct, size, stroke){
    var r = (size - stroke) / 2;
    var c = 2 * Math.PI * r;
    var dash = Math.max(0, Math.min(1, pct/100)) * c;
    var cx = size/2, cy = size/2;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">' +
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#E9D7B4" stroke-width="'+stroke+'"/>' +
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#A8672E" stroke-width="'+stroke+'" stroke-linecap="round" ' +
        'stroke-dasharray="'+dash.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 '+cx+' '+cy+')"/>' +
      '</svg>';
  }

  /* ---------- Card renderers ---------- */

  function badgeForTotal(cafe){
    if (hasAnyRating(cafe)){
      var pct = (totalScore(cafe)/MAX_TOTAL)*100;
      return '<div class="ring-badge">' + ringSvg(pct,46,4) + '<div class="ring-value">'+totalScore(cafe)+'</div></div>';
    }
    var color = avatarColor(cafe.name);
    return '<div class="avatar-badge" style="background:'+color+'22;color:'+color+'">'+initials(cafe.name)+'</div>';
  }

  function badgeForCriterion(cafe, key, max){
    var val = criterionValue(cafe, key);
    if (val !== null){
      var pct = (val/max)*100;
      return '<div class="ring-badge">' + ringSvg(pct,40,4) + '<div class="ring-value small">'+val+'</div></div>';
    }
    return '<div class="avatar-badge small" style="background:var(--line);color:var(--ink-soft)">–</div>';
  }

  function cafeCard(cafe, badgeHtml, leadingHtml){
    return '<button class="cafe-card" data-action="open" data-id="'+cafe.id+'">' +
      (leadingHtml || '') + badgeHtml +
      '<div class="cafe-info"><div class="cafe-name">'+escapeHtml(cafe.name)+'</div><div class="cafe-addr">'+escapeHtml(cafe.address)+'</div></div>' +
      '<div class="chev">'+ICONS.chevron+'</div>' +
      '</button>';
  }

  /* ---------- Tab: Cafés ---------- */

  function renderCafesTab(){
    var rated = state.cafes.filter(hasAnyRating).sort(function(a,b){ return totalScore(b)-totalScore(a); });
    var unrated = state.cafes.filter(function(c){ return !hasAnyRating(c); });
    var ordered = rated.concat(unrated);

    var html = '<div class="hero"><div class="hero-text"><h1>Carnet café</h1><p>Centre-ville de Montpellier</p></div></div>';

    html += '<div class="list-header"><span>' + rated.length + ' sur ' + state.cafes.length + ' notés</span>';
    html += '<button class="link-btn" data-action="reset-all">' + ICONS.refresh + ' Tout réinitialiser</button></div>';

    html += '<div class="cafe-list">';
    ordered.forEach(function(cafe){ html += cafeCard(cafe, badgeForTotal(cafe)); });

    if (state.addingNew){
      html += '<div class="new-form">';
      html += '<input type="text" id="new-name" placeholder="Nom du café" autofocus>';
      html += '<input type="text" id="new-addr" placeholder="Adresse">';
      html += '<div class="new-form-actions">';
      html += '<button class="btn btn-primary" data-action="confirm-add">Ajouter</button>';
      html += '<button class="btn" data-action="cancel-add">Annuler</button>';
      html += '</div></div>';
    } else {
      html += '<button class="add-row" data-action="start-add">' + ICONS.plus + ' Ajouter un café</button>';
    }
    html += '</div>';
    return html;
  }

  /* ---------- Tab: Classement ---------- */

  function rankedList(key, max){
    var withVal = [], withoutVal = [];
    state.cafes.forEach(function(c){
      if (criterionValue(c, key) !== null) withVal.push(c); else withoutVal.push(c);
    });
    withVal.sort(function(a,b){
      var diff = criterionValue(b,key) - criterionValue(a,key);
      return diff !== 0 ? diff : a.name.localeCompare(b.name);
    });
    withoutVal.sort(function(a,b){ return a.name.localeCompare(b.name); });
    return withVal.concat(withoutVal);
  }

  function renderRankingTab(){
    var opt = null;
    for (var i=0;i<RANK_OPTIONS.length;i++){ if (RANK_OPTIONS[i].key === state.rankBy) opt = RANK_OPTIONS[i]; }
    if (!opt) opt = RANK_OPTIONS[0];

    var html = '<div class="ranking-header"><h1>Classement</h1><p>Choisis un critère pour classer les cafés</p></div>';
    html += '<div class="chips">';
    RANK_OPTIONS.forEach(function(o){
      html += '<button class="chip'+(o.key===opt.key?' selected':'')+'" data-action="select-rank" data-key="'+o.key+'">'+o.label+'</button>';
    });
    html += '</div>';

    html += '<div class="ranking-list">';
    rankedList(opt.key, opt.max).forEach(function(cafe, idx){
      var rankClass = (idx < 3 && criterionValue(cafe, opt.key) !== null) ? 'rank-chip top' : 'rank-chip';
      var leading = '<div class="'+rankClass+'">'+(idx+1)+'</div>';
      html += cafeCard(cafe, badgeForCriterion(cafe, opt.key, opt.max), leading);
    });
    html += '</div>';
    return html;
  }

  /* ---------- Tab bar ---------- */

  function renderTabBar(){
    return '<div class="tabbar">' +
      '<button class="tab-btn'+(state.tab==='cafes'?' active':'')+'" data-action="switch-tab" data-tab="cafes">'+ICONS.cup+'<span>Cafés</span></button>' +
      '<button class="tab-btn'+(state.tab==='ranking'?' active':'')+'" data-action="switch-tab" data-tab="ranking">'+ICONS.trophy+'<span>Classement</span></button>' +
      '</div>';
  }

  /* ---------- Detail sheet ---------- */

  function renderDetail(){
    var cafe = getActiveCafe();
    var html = '<div class="sheet'+(cafe?' open':'')+'">';
    if (cafe){
      var total = totalScore(cafe);
      var pct = Math.round((total / MAX_TOTAL) * 100);

      html += '<div class="sheet-top">';
      html += '<button class="back-btn" data-action="back">'+ICONS.back+'</button>';
      html += '<div class="sheet-title"><h2>'+escapeHtml(cafe.name)+'</h2><p>'+escapeHtml(cafe.address)+'</p></div>';
      html += '</div>';

      html += '<div class="total-block"><div class="total-number">'+total+'<span>/'+MAX_TOTAL+'</span></div></div>';
      html += '<div class="total-bar"><div class="total-bar-fill" style="width:'+pct+'%"></div></div>';

      html += '<div class="criteria">';
      CRITERIA.forEach(function(c){
        html += '<div class="criterion">';
        html += '<div class="criterion-label">'+c.label+' <span style="color:var(--ink-soft);font-weight:400;">/'+c.max+'</span></div>';
        if (c.desc) html += '<div class="criterion-desc">'+c.desc+'</div>';
        html += '<div class="pills">';
        for (var v=0; v<=c.max; v++){
          var sel = cafe.scores[c.key] === v;
          var lbl = c.binary ? (v === 1 ? 'Oui' : 'Non') : String(v);
          html += '<button class="pill'+(sel?' selected':'')+'" data-action="set-score" data-key="'+c.key+'" data-value="'+v+'">'+lbl+'</button>';
        }
        html += '</div></div>';
      });
      html += '</div>';

      html += '<div class="notes-block"><label for="comment-field">Notes</label>';
      html += '<textarea id="comment-field" data-action="comment" placeholder="Note libre (optionnel)">'+escapeHtml(cafe.comment)+'</textarea></div>';

      html += '<div class="sheet-actions">';
      html += '<button class="text-action" data-action="ask-reset-one">'+ICONS.refresh+' Réinitialiser les notes</button>';
      if (cafe.custom){
        html += '<button class="text-action danger" data-action="ask-delete">'+ICONS.trash+' Supprimer ce café</button>';
      }
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  /* ---------- Confirm modal ---------- */

  function renderModal(){
    if (!state.confirm) return '';
    return '<div class="modal-overlay" data-action="modal-cancel">' +
      '<div class="modal-box" data-action="noop">' +
      '<p>'+escapeHtml(state.confirm.message)+'</p>' +
      '<div class="modal-actions">' +
      '<button class="btn" data-action="modal-cancel">Annuler</button>' +
      '<button class="btn btn-danger" data-action="modal-confirm">Confirmer</button>' +
      '</div></div></div>';
  }

  /* ---------- Root render ---------- */

  function render(){
    var app = document.getElementById('app');
    if (state.loading){
      app.innerHTML =
        '<div class="hero"><div class="hero-text"><h1>Carnet café</h1><p>Centre-ville de Montpellier</p></div></div>' +
        '<div class="loading">Chargement du carnet…</div>';
      return;
    }
    var main = state.tab === 'ranking' ? renderRankingTab() : renderCafesTab();
    app.innerHTML = main + renderTabBar() + renderDetail() + renderModal();
  }

  /* ---------- Events ---------- */

  document.getElementById('app').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    if (action === 'noop'){
      return;
    } else if (action === 'switch-tab'){
      state.tab = el.getAttribute('data-tab');
      render();
    } else if (action === 'select-rank'){
      state.rankBy = el.getAttribute('data-key');
      render();
    } else if (action === 'open'){
      state.activeId = el.getAttribute('data-id');
      render();
    } else if (action === 'back'){
      state.activeId = null;
      render();
    } else if (action === 'set-score'){
      var cafe = getActiveCafe();
      if (!cafe) return;
      var key = el.getAttribute('data-key');
      var value = parseInt(el.getAttribute('data-value'), 10);
      cafe.scores[key] = (cafe.scores[key] === value) ? null : value;
      scheduleSave();
      render();
    } else if (action === 'start-add'){
      state.addingNew = true;
      render();
      var nameInput = document.getElementById('new-name');
      if (nameInput) nameInput.focus();
    } else if (action === 'cancel-add'){
      state.addingNew = false;
      render();
    } else if (action === 'confirm-add'){
      var nameEl = document.getElementById('new-name');
      var addrEl = document.getElementById('new-addr');
      var name = (nameEl.value || '').trim();
      var addr = (addrEl.value || '').trim();
      if (!name) { nameEl.focus(); return; }
      state.cafes.push({
        id: 'custom-' + Date.now(),
        name: name,
        address: addr,
        scores: emptyScores(),
        comment: '',
        custom: true
      });
      state.addingNew = false;
      scheduleSave();
      render();
    } else if (action === 'reset-all'){
      state.confirm = { type:'reset-all', message:'Réinitialiser les notes de tous les cafés ? Cette action est irréversible.' };
      render();
    } else if (action === 'ask-reset-one'){
      var cr = getActiveCafe();
      if (!cr) return;
      state.confirm = { type:'reset-one', id:cr.id, message:'Réinitialiser les notes de « '+cr.name+' » ?' };
      render();
    } else if (action === 'ask-delete'){
      var cd = getActiveCafe();
      if (!cd) return;
      state.confirm = { type:'delete-one', id:cd.id, message:'Supprimer « '+cd.name+' » de ton carnet ? Cette action est irréversible.' };
      render();
    } else if (action === 'modal-cancel'){
      state.confirm = null;
      render();
    } else if (action === 'modal-confirm'){
      var conf = state.confirm;
      if (conf){
        if (conf.type === 'reset-all'){
          state.cafes.forEach(function(c){ c.scores = emptyScores(); });
        } else if (conf.type === 'reset-one'){
          var t1 = findCafe(conf.id);
          if (t1) t1.scores = emptyScores();
        } else if (conf.type === 'delete-one'){
          state.cafes = state.cafes.filter(function(c){ return c.id !== conf.id; });
          state.activeId = null;
        }
        scheduleSave();
      }
      state.confirm = null;
      render();
    }
  });

  document.getElementById('app').addEventListener('input', function(e){
    if (e.target && e.target.getAttribute('data-action') === 'comment'){
      var cafe = getActiveCafe();
      if (!cafe) return;
      cafe.comment = e.target.value;
      scheduleSave();
    }
  });

  /* ---------- Init ---------- */

  function normalize(loaded){
    loaded.forEach(function(c){
      if (!c.scores) c.scores = emptyScores();
      CRITERIA.forEach(function(cr){ if (!(cr.key in c.scores)) c.scores[cr.key] = null; });
      if (typeof c.comment !== 'string') c.comment = '';
      if (typeof c.custom !== 'boolean') c.custom = false;
    });
    return loaded;
  }

  function init(){
    storageBackend.get(STORAGE_KEY).then(function(value){
      var loaded = null;
      try { loaded = JSON.parse(value); } catch(e){ loaded = null; }
      state.cafes = (Array.isArray(loaded) && loaded.length) ? normalize(loaded) : DEFAULT_CAFES;
      state.loading = false;
      render();
    }).catch(function(){
      // migrate from the previous single-tab version's storage key, if present
      storageBackend.get(OLD_STORAGE_KEY).then(function(oldValue){
        var oldLoaded = null;
        try { oldLoaded = JSON.parse(oldValue); } catch(e){ oldLoaded = null; }
        state.cafes = (Array.isArray(oldLoaded) && oldLoaded.length) ? normalize(oldLoaded) : DEFAULT_CAFES;
        state.loading = false;
        render();
        storageBackend.set(STORAGE_KEY, JSON.stringify(state.cafes)).catch(function(){});
      }).catch(function(){
        state.cafes = DEFAULT_CAFES;
        state.loading = false;
        render();
        storageBackend.set(STORAGE_KEY, JSON.stringify(state.cafes)).catch(function(){});
      });
    });
  }

  render();
  init();
})();
</script>
</body>
</html>
